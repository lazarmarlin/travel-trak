<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Trak</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; }
  .app { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; }
  header { background: #1d1d1f; color: white; padding: 16px; font-weight: 600; }
  .content { padding: 16px; padding-bottom: 80px; }
  .stats { display: flex; gap: 16px; margin-bottom: 20px; }
  .stat { flex: 1; background: #f5f5f7; border-radius: 12px; padding: 16px; text-align: center; }
  .stat .num { font-size: 28px; font-weight: 700; }
  .stat .label { font-size: 13px; color: #86868b; }
  .list-item { background: #fff; border: 1px solid #e5e5ea; border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .btn { background: #007aff; color: white; border: none; border-radius: 10px; padding: 14px; width: 100%; font-size: 16px; font-weight: 600; margin-top: 8px; }
  .btn:disabled { background: #34c759; }
  .tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid #e5e5ea; display: flex; }
  .tab { flex: 1; text-align: center; padding: 10px 0; font-size: 11px; color: #86868b; cursor: pointer; }
  .tab.active { color: #007aff; font-weight: 600; }
  .onboard { text-align: center; padding: 40px 20px; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: #007aff; color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 16px; }
  input { width: 100%; padding: 12px; border: 1px solid #e5e5ea; border-radius: 8px; margin: 8px 0; font-size: 16px; }
  .error { color: #ff3b30; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .hint { font-size: 12px; color: #86868b; margin-top: 16px; text-align: left; }
</style>
</head>
<body>
<div class="app">
  <header><span id="header-title">Travel Trak</span></header>
  <div class="content" id="content"></div>
  <nav class="tabs" id="tabs" style="display:none;">
    <div class="tab active" data-tab="dashboard">Dashboard</div>
    <div class="tab" data-tab="explore">Explore</div>
  </nav>
</div>
<script>
const SUPABASE_URL = "https://nwptxncvixkfapbizdgg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9BTKJegib7EsfvshAWH8hg_78PbUaa8";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const state = { user: null, profile: null, currentTab: "auth", pois: [], visits: new Set() };
async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session?.user) {
    state.user = session.user;
    await ensureProfile();
    await loadProfile();
    state.currentTab = "dashboard";
    document.getElementById("tabs").style.display = "flex";
  }
  render();
}
async function ensureProfile() {
  if (!state.user) return;
  const { data } = await supabase.from("profiles").select("id").eq("id", state.user.id).maybeSingle();
  if (!data) {
    await supabase.from("profiles").insert({ id: state.user.id, username: state.user.email?.split("@")[0] });
  }
}
async function loadProfile() {
  const { data } = await supabase.from("profiles").select("*").eq("id", state.user.id).single();
  state.profile = data || { total_points: 0, visited_count: 0 };
}
function render() {
  const content = document.getElementById("content");
  const title = document.getElementById("header-title");
  if (state.currentTab === "auth") {
    title.textContent = "Travel Trak";
    content.innerHTML = `<div class="onboard"><div class="avatar">🗺️</div><h2>Sign in</h2><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" onclick="signIn()">Sign In</button><button class="btn" style="background:#34c759;" onclick="signUp()">Create Account</button><div id="auth-error" class="error"></div><div class="hint"><strong>If sign-up does nothing:</strong><br>1. Check your email for a confirmation link<br>2. In Supabase → Authentication → Providers → Email, turn <em>Confirm email</em> off for testing</div></div>`;
    return;
  }
  title.textContent = "Travel Trak";
  const pts = state.profile?.total_points || 0;
  const vis = state.profile?.visited_count || 0;
  content.innerHTML = `<div class="stats"><div class="stat"><div class="num">${pts.toLocaleString()}</div><div class="label">points</div></div><div class="stat"><div class="num">${vis}</div><div class="label">visited</div></div></div><div class="list-item"><div>Signed in</div><div>${state.user?.email || ""}</div></div><button class="btn" onclick="signOut()">Sign Out</button>`;
}
async function signIn() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errEl = document.getElementById("auth-error");
  errEl.textContent = "Signing in...";
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  state.user = data.user;
  await ensureProfile();
  await loadProfile();
  state.currentTab = "dashboard";
  document.getElementById("tabs").style.display = "flex";
  render();
}
async function signUp() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errEl = document.getElementById("auth-error");
  errEl.textContent = "Creating account...";
  const { data, error } = await supabase.auth.signUp({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  if (data.user && !data.session) {
    errEl.textContent = "Account created. Check your email to confirm, then sign in.";
  } else if (data.session) {
    state.user = data.user;
    await ensureProfile();
    await loadProfile();
    state.currentTab = "dashboard";
    document.getElementById("tabs").style.display = "flex";
    render();
  }
}
async function signOut() {
  await supabase.auth.signOut();
  state.user = null; state.profile = null; state.currentTab = "auth";
  document.getElementById("tabs").style.display = "none";
  render();
}
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    state.currentTab = tab.dataset.tab;
    render();
  });
});
init();
</script>
</body>
</html>
